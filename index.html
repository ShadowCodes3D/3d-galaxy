<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Luminous Spiral Galaxy</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #000000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 18, 32);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.2, 'rgba(220, 240, 255, 0.85)');
    grad.addColorStop(0.5, 'rgba(130, 80, 255, 0.3)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const particleCount = 18000;
  const positions = new Float32Array(particleCount * 3);
  const targetPositions = new Float32Array(particleCount * 3);
  const startPositions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  const coreColor = new THREE.Color(0xffffff);
  const innerColor = new THREE.Color(0x00f2ff);
  const midColor = new THREE.Color(0x9d4edd);
  const outerColor = new THREE.Color(0xff2a85);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const r = Math.pow(Math.random(), 1.45) * 24;
    const arm = (i % 4 / 4) * Math.PI * 2;
    const angle = arm + r * 0.34;

    const scatter = (Math.random() - 0.5) * (0.4 + r * 0.14);
    const gx = Math.cos(angle) * r + scatter;
    const gy = (Math.random() - 0.5) * (1.8 / (1 + r * 0.15));
    const gz = Math.sin(angle) * r + (Math.random() - 0.5) * (0.4 + r * 0.14);

    targetPositions[i3] = gx;
    targetPositions[i3 + 1] = gy;
    targetPositions[i3 + 2] = gz;

    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    const burstR = Math.random() * 1.5;
    startPositions[i3] = burstR * Math.sin(phi) * Math.cos(theta);
    startPositions[i3 + 1] = burstR * Math.sin(phi) * Math.sin(theta);
    startPositions[i3 + 2] = burstR * Math.cos(phi);

    positions[i3] = startPositions[i3];
    positions[i3 + 1] = startPositions[i3 + 1];
    positions[i3 + 2] = startPositions[i3 + 2];

    const c = new THREE.Color();
    const ratio = r / 24;
    if (ratio < 0.15) {
      c.copy(coreColor).lerp(innerColor, ratio / 0.15);
    } else if (ratio < 0.55) {
      c.copy(innerColor).lerp(midColor, (ratio - 0.15) / 0.4);
    } else {
      c.copy(midColor).lerp(outerColor, (ratio - 0.55) / 0.45);
    }

    colors[i3] = c.r;
    colors[i3 + 1] = c.g;
    colors[i3 + 2] = c.b;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.42,
    map: createGlowTexture(),
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const galaxy = new THREE.Points(geometry, material);
  scene.add(galaxy);

  const bgCount = 2500;
  const bgPos = new Float32Array(bgCount * 3);
  for (let i = 0; i < bgCount; i++) {
    bgPos[i * 3] = (Math.random() - 0.5) * 180;
    bgPos[i * 3 + 1] = (Math.random() - 0.5) * 180;
    bgPos[i * 3 + 2] = (Math.random() - 0.5) * 180;
  }
  const bgGeo = new THREE.BufferGeometry();
  bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
  const bgMat = new THREE.PointsMaterial({
    size: 0.25,
    map: createGlowTexture(),
    color: 0xaaccff,
    transparent: true,
    opacity: 0.65,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const bgStars = new THREE.Points(bgGeo, bgMat);
  scene.add(bgStars);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    const posAttr = geometry.attributes.position;
    const arr = posAttr.array;

    if (t < 5.5) {
      const progress = Math.min(Math.max((t - 1.0) / 4.5, 0), 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      for (let i = 0; i < particleCount * 3; i++) {
        arr[i] = startPositions[i] + (targetPositions[i] - startPositions[i]) * ease;
      }
      posAttr.needsUpdate = true;
    }

    galaxy.rotation.y = t * 0.22;
    galaxy.rotation.z = Math.sin(t * 0.3) * 0.08;
    bgStars.rotation.y = t * 0.02;

    const pulse = 1 + Math.sin(t * 2.5) * 0.025;
    galaxy.scale.set(pulse, pulse, pulse);

    camera.position.x = Math.sin(t * 0.15) * 6;
    camera.position.y = 16 + Math.cos(t * 0.2) * 4;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
