<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Luminous Spiral Galaxy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="galaxyCanvas"></canvas>

  <script>
    const THEME = "cosmic_mix";
    const PARTICLE_COUNT = 1500;

    const THEMES = {
      cosmic_mix: {
        coreColor: "#fff4cc",
        colors: ["#00f0ff", "#bd00ff", "#ff00aa", "#4d79ff"],
        glow: "rgba(120, 0, 255, 0.32)",
        ring: "0, 240, 255",
        star: "200, 230, 255"
      },
      milky_blue: {
        coreColor: "#ffffff",
        colors: ["#00e5ff", "#00b0ff", "#2979ff", "#80d8ff"],
        glow: "rgba(0, 176, 255, 0.32)",
        ring: "0, 229, 255",
        star: "180, 230, 255"
      },
      nebula_pink: {
        coreColor: "#ffe6f7",
        colors: ["#ff007f", "#d500f9", "#ff4da6", "#00e5ff"],
        glow: "rgba(255, 0, 150, 0.32)",
        ring: "255, 0, 150",
        star: "255, 190, 235"
      },
      golden_void: {
        coreColor: "#ffffff",
        colors: ["#ffee00", "#ff9900", "#ff5500", "#fff59d"],
        glow: "rgba(255, 180, 0, 0.35)",
        ring: "255, 200, 0",
        star: "255, 240, 180"
      }
    };

    const currentTheme = THEMES[THEME] || THEMES.cosmic_mix;

    const canvas = document.getElementById("galaxyCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function createGlowSprite(color, glowRgba, size = 36) {
      const sCanvas = document.createElement("canvas");
      sCanvas.width = size;
      sCanvas.height = size;
      const sCtx = sCanvas.getContext("2d");

      const grad = sCtx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.22, color);
      grad.addColorStop(0.55, glowRgba);
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");

      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, size, size);
      return sCanvas;
    }

    const sprites = currentTheme.colors.map(c =>
      createGlowSprite(c, currentTheme.glow, 36)
    );
    const coreSprite = createGlowSprite(currentTheme.coreColor, currentTheme.glow, 160);

    const bgStars = [];
    for (let i = 0; i < 110; i++) {
      bgStars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 1.8 + 0.6,
        phase: Math.random() * Math.PI * 2
      });
    }

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    const particles = [];
    const ARMS = 4;

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const r = Math.pow(Math.random(), 1.45) * 24;
        const armIndex = i % ARMS;
        const armAngle = (armIndex / ARMS) * Math.PI * 2;
        const spin = r * 0.34;

        const scatter = (Math.random() - 0.5) * (0.5 + r * 0.08);
        const angle = armAngle + spin + scatter;

        const gx = Math.cos(angle) * r;
        const gz = Math.sin(angle) * r;
        const gy = (Math.random() - 0.5) * (3.8 / (1 + r * 0.18));

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const burstR = 14 + Math.random() * 24;
        const bx = burstR * Math.sin(phi) * Math.cos(theta);
        const by = burstR * Math.sin(phi) * Math.sin(theta);
        const bz = burstR * Math.cos(phi);

        const warpSpeed = 6 + Math.random() * 16;
        const wx = Math.cos(angle) * warpSpeed;
        const wy = (Math.random() - 0.5) * 10;
        const wz = Math.sin(angle) * warpSpeed;

        let sprite;
        if (r < 4.5 && Math.random() < 0.65) {
          sprite = coreSprite;
        } else {
          sprite = sprites[Math.floor(Math.random() * sprites.length)];
        }

        particles.push({
          gx, gy, gz,
          bx, by, bz,
          wx, wy, wz,
          r,
          size: r < 4 ? Math.random() * 11 + 7 : Math.random() * 8 + 4,
          sprite,
          alpha: Math.random() * 0.45 + 0.55,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    initParticles();

    let startTime = performance.now();
    let angleY = 0;

    function restartAnimation() {
      startTime = performance.now();
      angleY = 0;
      initParticles();
    }
    window.addEventListener("click", restartAnimation);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "KeyR") {
        restartAnimation();
      }
    });

    function drawBackgroundStars(elapsed) {
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        let starAlpha = 0.25 + 0.3 * Math.sin(elapsed * 2.2 + s.phase);
        if (elapsed > 28.8) {
          starAlpha *= Math.max(0, 1 - (elapsed - 28.8) / 1.2);
        }
        ctx.fillStyle = `rgba(${currentTheme.star}, ${starAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fillRect(0, 0, width, height);

      drawBackgroundStars(elapsed);

      const baseScale = Math.min(width, height) / 46;
      const fov = 420;

      ctx.globalCompositeOperation = "lighter";

      if (elapsed < 1.6) {
        const p = elapsed / 1.6;
        const pulse = 1 + Math.sin(elapsed * 18) * 0.15;
        const orbSize = (20 + easeOutExpo(p) * 150) * pulse;
        ctx.globalAlpha = Math.min(1, p * 2.2);
        ctx.drawImage(
          coreSprite,
          width / 2 - orbSize / 2,
          height / 2 - orbSize / 2,
          orbSize,
          orbSize
        );
      }

      if (elapsed >= 1.5 && elapsed <= 27.8) {
        if (elapsed < 5.5) {
          angleY += 0.032;
        } else if (elapsed < 24.5) {
          angleY += 0.011;
        } else {
          angleY += 0.026;
        }

        if (elapsed >= 5.3 && elapsed <= 6.3) {
          const sp = (elapsed - 5.3) / 1.0;
          const ringRadius = sp * Math.min(width, height) * 0.5;
          ctx.beginPath();
          ctx.arc(width / 2, height / 2, ringRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${currentTheme.ring}, ${(1 - sp) * 0.7})`;
          ctx.lineWidth = (1 - sp) * 6;
          ctx.stroke();
        }

        if (elapsed >= 4.5 && elapsed <= 26.2) {
          let coreAlpha = 0.85;
          if (elapsed < 5.5) coreAlpha *= (elapsed - 4.5);
          if (elapsed > 24.5) coreAlpha *= Math.max(0, 1 - (elapsed - 24.5) / 1.7);
          const corePulse = 1 + Math.sin(elapsed * 3) * 0.08;
          const cSize = Math.min(width, height) * 0.34 * corePulse;
          ctx.globalAlpha = coreAlpha;
          ctx.drawImage(
            coreSprite,
            width / 2 - cSize / 2,
            height / 2 - cSize / 2,
            cSize,
            cSize
          );
        }

        const tiltX = 0.92 + Math.sin(elapsed * 0.45) * 0.16;
        const cosX = Math.cos(tiltX);
        const sinX = Math.sin(tiltX);

        const cosY = Math.cos(angleY);
        const sinY = Math.sin(angleY);

        const zoom = elapsed >= 5.5 && elapsed < 24.5
          ? 1 + Math.sin((elapsed - 5.5) * 0.4) * 0.08
          : 1;

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          let x, y, z;
          let alphaMult = 1;

          if (elapsed < 3.0) {
            const p = easeOutExpo(Math.min(1, (elapsed - 1.5) / 1.5));
            x = pt.bx * p;
            y = pt.by * p;
            z = pt.bz * p;
            alphaMult = Math.min(1, p * 1.5);
          } else if (elapsed < 5.5) {
            const p = easeInOutCubic((elapsed - 3.0) / 2.5);
            x = pt.bx + (pt.gx - pt.bx) * p;
            y = pt.by + (pt.gy - pt.by) * p;
            z = pt.bz + (pt.gz - pt.bz) * p;
          } else if (elapsed < 24.5) {
            x = pt.gx * zoom;
            y = pt.gy * zoom;
            z = pt.gz * zoom;
          } else {
            const dt = elapsed - 24.5;
            const p = Math.min(1, dt / 3.2);
            x = pt.gx + pt.wx * dt * 1.9;
            y = pt.gy + pt.wy * dt * 1.5;
            z = pt.gz + pt.wz * dt * 1.9;
            alphaMult = Math.max(0, 1 - p * 1.15);
          }

          if (alphaMult <= 0.01) continue;

          const rx = x * cosY - z * sinY;
          const rz1 = z * cosY + x * sinY;

          const ry = y * cosX - rz1 * sinX;
          const rz = rz1 * cosX + y * sinX;

          const perspective = fov / (fov + rz * baseScale + 260);
          if (perspective <= 0) continue;

          const screenX = width / 2 + rx * baseScale * perspective;
          const screenY = height / 2 + ry * baseScale * perspective;
          const drawSize = pt.size * perspective * 1.5;

          const twinkle = 0.72 + 0.28 * Math.sin(elapsed * 4 + pt.phase);
          ctx.globalAlpha = pt.alpha * twinkle * alphaMult;
          ctx.drawImage(
            pt.sprite,
            screenX - drawSize / 2,
            screenY - drawSize / 2,
            drawSize,
            drawSize
          );
        }
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
